<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Personal Transaction Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            font-family: Arial, sans-serif;
            color: #0f172a;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 24px;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
        }

        .logo {
            width: 48px;
            height: 48px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: #2563eb;
            color: #ffffff;
            font-size: 22px;
            font-weight: 800;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 24px;
            font-weight: 800;
        }

        .subtitle {
            margin: 8px 0 28px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #475569;
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 44px;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .login-button {
            width: 100%;
            height: 44px;
            margin-top: 6px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        #message {
            min-height: 20px;
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
        }

        .register-link {
            margin-top: 22px;
            text-align: center;
            font-size: 13px;
            color: #64748b;
        }

        .register-link a {
            color: #2563eb;
            font-weight: 700;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">₹</div>

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to your Personal Transaction Manager
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="login-button">
                    Login
                </button>

                <div style="text-align: right; margin-top: 10px;">
                    <a href="forgot-password.html" style="
            color: #2563eb;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        ">
                        Forgot Password?
                    </a>
                </div>

                <div id="message"></div>
            </form>

            <div class="register-link">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </div>

        </div>

    </div>

    <script>

        document.getElementById("loginForm").addEventListener("submit", async function (event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");

            message.textContent = "Logging in...";
            message.style.color = "#64748b";

            try {

                const response = await fetch("/api/users/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.text();

                if (!response.ok) {
                    throw new Error(data || "Login failed");
                }

                // Get the currently logged-in user's details
                const userResponse = await fetch("/api/users/me");

                if (!userResponse.ok) {
                    throw new Error("Unable to get user details");
                }

                const user = await userResponse.json();

                message.textContent = "Login successful.";
                message.style.color = "#15803d";

                setTimeout(function () {

                    if (user.role === "ADMIN") {
                        window.location.href = "admin.html";
                    } else {
                        window.location.href = "index.html";
                    }

                }, 500);

            } catch (error) {

                message.textContent = error.message;
                message.style.color = "#dc2626";
            }

        });

    </script>
</body>

</html>
