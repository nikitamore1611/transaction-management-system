<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Personal Transaction Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            font-family: Arial, sans-serif;
            color: #0f172a;
        }

        .register-container {
            width: 100%;
            max-width: 460px;
            padding: 24px;
        }

        .register-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
        }

        .logo {
            width: 48px;
            height: 48px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: #2563eb;
            color: #ffffff;
            font-size: 22px;
            font-weight: 800;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 24px;
            font-weight: 800;
        }

        .subtitle {
            margin: 8px 0 28px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #475569;
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 44px;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .register-button {
            width: 100%;
            height: 44px;
            margin-top: 6px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .register-button:hover {
            background: #1d4ed8;
        }

        #message {
            min-height: 20px;
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
        }

        .login-link {
            margin-top: 22px;
            text-align: center;
            font-size: 13px;
            color: #64748b;
        }

        .login-link a {
            color: #2563eb;
            font-weight: 700;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="register-container">

    <div class="register-card">

        <div class="logo">₹</div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Create your Personal Transaction Manager account
        </p>

        <form id="registerForm">

            <div class="form-group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number</label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter your mobile number"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="openingBalance">Opening Balance (₹)</label>

                <input
                    type="number"
                    id="openingBalance"
                    min="0"
                    step="0.01"
                    value="0"
                    required
                >
            </div>

            <button
                type="submit"
                class="register-button">
                Create Account
            </button>

            <div id="message"></div>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

</div>

<script>

document.getElementById("registerForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const mobile =
        document.getElementById("mobile").value.trim();

    const password =
        document.getElementById("password").value;

    const openingBalance =
        Number(document.getElementById("openingBalance").value);

    const message =
        document.getElementById("message");

    message.textContent = "Creating account...";
    message.style.color = "#64748b";

    try {

        const response = await fetch("/api/users/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                email: email,
                mobile: mobile,
                password: password,
                openingBalance: openingBalance
            })
        });

        const data = await response.text();

        if (!response.ok) {
            throw new Error(data || "Registration failed");
        }

        message.textContent =
            "Account created successfully. Redirecting to login...";

        message.style.color = "#15803d";

        setTimeout(function() {
            window.location.href = "login.html";
        }, 1000);

    } catch (error) {

        message.textContent = error.message;
        message.style.color = "#dc2626";
    }

});

</script>

</body>
</html>
