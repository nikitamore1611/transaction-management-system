<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Transaction Management System</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ==============================
           ADMIN DASHBOARD
           ============================== */

        body {
            background: #f4f6f9;
        }

        .admin-container {
            width: 100%;
            max-width: 1250px;
            margin: 0 auto;
            padding: 30px;
        }

        /* Header */

        .admin-header {
            background: #ffffff;
            border-radius: 14px;
            padding: 25px 30px;
            margin-bottom: 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
        }

        .admin-title h1 {
            margin: 0 0 6px;
            font-size: 28px;
            color: #1f2937;
        }

        .admin-title p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
        }

        .admin-badge {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 12px;

            border-radius: 20px;

            background: #eef2ff;
            color: #4338ca;

            font-size: 12px;
            font-weight: 600;
        }

        /* Logout */

        .logout-btn {
            border: none;
            border-radius: 8px;

            padding: 10px 18px;

            background: #dc3545;
            color: white;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .logout-btn:hover {
            background: #bb2d3b;
            transform: translateY(-1px);
        }

        /* Sections */

        .admin-section {
            background: #ffffff;
            border-radius: 14px;

            padding: 25px;
            margin-bottom: 25px;

            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .section-header h2 {
            margin: 0;
            color: #1f2937;
            font-size: 21px;
        }

        .section-description {
            color: #6b7280;
            font-size: 13px;
            margin-top: 5px;
        }

        /* User list */

        #userList {
            width: 100%;
            overflow-x: auto;
        }

        #userList table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        #userList th {
            background: #f8fafc;
            color: #475569;

            font-size: 13px;
            font-weight: 600;

            padding: 13px 14px;

            text-align: left;

            border-bottom: 1px solid #e5e7eb;
        }

        #userList td {
            padding: 14px;

            font-size: 14px;
            color: #374151;

            border-bottom: 1px solid #f0f0f0;
        }

        #userList tr:hover td {
            background: #fafafa;
        }

        /* Action history */

        #actionHistory {
            width: 100%;
            overflow-x: auto;
        }

        #actionHistory table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        #actionHistory th {
            background: #f8fafc;
            color: #475569;

            font-size: 13px;
            font-weight: 600;

            padding: 13px 14px;

            text-align: left;

            border-bottom: 1px solid #e5e7eb;
        }

        #actionHistory td {
            padding: 14px;

            font-size: 14px;
            color: #374151;

            border-bottom: 1px solid #f0f0f0;
        }

        #actionHistory tr:hover td {
            background: #fafafa;
        }

        /* Loading */

        #userList:empty,
        #actionHistory:empty {
            min-height: 40px;
        }

        /* Empty / loading messages */

        .loading-message {
            padding: 25px;
            text-align: center;
            color: #6b7280;
        }

        /* Responsive */

        @media (max-width: 768px) {

            .admin-container {
                padding: 15px;
            }

            .admin-header {
                padding: 20px;
                flex-direction: column;
                align-items: flex-start;
                gap: 18px;
            }

            .admin-title h1 {
                font-size: 24px;
            }

            .logout-btn {
                width: 100%;
            }

            .admin-section {
                padding: 18px;
            }

            .section-header {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <div class="admin-container">

        <!-- ==============================
             ADMIN HEADER
             ============================== -->

        <div class="admin-header">

            <div class="admin-title">

                <h1>Admin Dashboard</h1>

                <p>
                    Manage registered users and monitor administrative activity.
                </p>

                <span class="admin-badge">
                    Administrator
                </span>

            </div>

            <button
                class="logout-btn"
                onclick="logout()">
                Logout
            </button>

        </div>


        <!-- ==============================
             USER MANAGEMENT
             ============================== -->

        <div class="admin-section">

            <div class="section-header">

                <div>

                    <h2>User Management</h2>

                    <div class="section-description">
                        View and manage registered user accounts.
                    </div>

                </div>

            </div>

            <div id="userList">
                Loading users...
            </div>

        </div>


        <!-- ==============================
             ADMIN ACTION HISTORY
             ============================== -->

        <div class="admin-section">

            <div class="section-header">

                <div>

                    <h2>Admin Action History</h2>

                    <div class="section-description">
                        Records of administrative actions performed on user accounts.
                    </div>

                </div>

            </div>

            <div id="actionHistory">
                Loading action history...
            </div>

        </div>

    </div>


    <script src="js/admin.js"></script>

</body>

</html>
