<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monthly Transaction Report</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* =========================
           REPORT PAGE
        ========================= */

        body {
            background: #f5f7fb;
            color: #1e293b;
            font-family: Arial, Helvetica, sans-serif;
        }

        .report-container {
            width: 94%;
            max-width: 1400px;
            margin: 35px auto;
        }

        /* =========================
           HEADER
        ========================= */

        .report-header {
            background: #ffffff;
            padding: 28px 32px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.06);
        }

        .report-header h1 {
            margin: 0;
            font-size: 32px;
            color: #1e3a5f;
            font-weight: 700;
        }

        .report-header p {
            margin: 8px 0 0;
            color: #64748b;
            font-size: 15px;
        }

        /* =========================
           SUMMARY CARDS
        ========================= */

        .summary-section {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 24px;
            min-height: 115px;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.06);
            position: relative;
            overflow: hidden;
        }

        .summary-card::after {
            content: "";
            position: absolute;
            width: 70px;
            height: 70px;
            right: -25px;
            bottom: -25px;
            border-radius: 50%;
            background: #eef4ff;
        }

        .summary-card h3 {
            margin: 0 0 15px;
            font-size: 13px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .summary-card p {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
        }

        /* Different summary card accents */

        .summary-card:nth-child(1)::after {
            background: #ecfdf5;
        }

        .summary-card:nth-child(2)::after {
            background: #eff6ff;
        }

        .summary-card:nth-child(3)::after {
            background: #fef2f2;
        }

        .summary-card:nth-child(4)::after {
            background: #f0f9ff;
        }

        /* =========================
           SECTIONS
        ========================= */

        .report-section {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.06);
        }

        .report-section h2 {
            margin: 0 0 18px;
            font-size: 21px;
            color: #1e3a5f;
        }

        .report-summary-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            color: #475569;
            font-size: 15px;
        }

        .report-summary-row strong {
            color: #0f172a;
        }

        #reportMessage {
            margin: 15px 0 0;
            padding: 12px 15px;
            border-radius: 8px;
            background: #f8fafc;
            color: #64748b;
            font-size: 14px;
        }

        /* =========================
           TRANSACTION TABLE
        ========================= */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
        }

        table {
            width: 100%;
            min-width: 750px;
            border-collapse: collapse;
            background: #ffffff;
        }

        thead {
            background: #f8fafc;
        }

        th {
            padding: 15px 16px;
            text-align: left;
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #e2e8f0;
        }

        td {
            padding: 16px;
            font-size: 14px;
            color: #334155;
            border-bottom: 1px solid #f1f5f9;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* =========================
           BUTTON AREA
        ========================= */

        .report-controls {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 22px 28px;
            display: flex;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.06);
        }

        .report-controls button {
            border: none;
            border-radius: 9px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        #downloadPdf {
            background: #2563eb;
            color: #ffffff;
        }

        #downloadPdf:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        #backToDashboard {
            background: #e2e8f0;
            color: #334155;
        }

        #backToDashboard:hover {
            background: #cbd5e1;
            transform: translateY(-1px);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 900px) {

            .summary-section {
                grid-template-columns: repeat(2, 1fr);
            }

            .report-container {
                width: 92%;
            }
        }

        @media (max-width: 600px) {

            .report-container {
                width: 94%;
                margin: 20px auto;
            }

            .report-header {
                padding: 22px;
            }

            .report-header h1 {
                font-size: 25px;
            }

            .summary-section {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .summary-card {
                padding: 20px;
            }

            .report-section {
                padding: 20px;
            }

            .report-controls {
                padding: 18px;
                flex-direction: column;
            }

            .report-controls button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="report-container">

        <!-- =========================
             HEADER
        ========================= -->

        <header class="report-header">
            <h1>Monthly Transaction Report</h1>
            <p id="reportPeriod">Report Period</p>
        </header>


        <!-- =========================
             SUMMARY CARDS
        ========================= -->

        <section class="summary-section">

            <div class="summary-card">
                <h3>Opening Balance</h3>
                <p id="openingBalance">₹0.00</p>
            </div>

            <div class="summary-card">
                <h3>Total Credit</h3>
                <p id="totalCredit">₹0.00</p>
            </div>

            <div class="summary-card">
                <h3>Total Debit</h3>
                <p id="totalDebit">₹0.00</p>
            </div>

            <div class="summary-card">
                <h3>Closing Balance</h3>
                <p id="closingBalance">₹0.00</p>
            </div>

        </section>


        <!-- =========================
             REPORT SUMMARY
        ========================= -->

        <section class="report-section">

            <h2>Report Summary</h2>

            <div class="report-summary-row">
                <span>Total Transactions:</span>
                <strong id="totalTransactions">0</strong>
            </div>

            <p id="reportMessage"></p>

        </section>


        <!-- =========================
             TRANSACTION DETAILS
        ========================= -->

        <section class="report-section">

            <h2>Transaction Details</h2>

            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Amount</th>
                            <th>Reason</th>
                            <th>Balance</th>
                        </tr>
                    </thead>

                    <tbody id="reportTransactionTableBody">
                    </tbody>

                </table>

            </div>

        </section>


        <!-- =========================
             CONTROLS
        ========================= -->

        <section class="report-controls">

            <button id="downloadPdf">
                Download PDF
            </button>

            <button id="backToDashboard">
                Back to Dashboard
            </button>

        </section>

    </div>


    <script src="js/report.js"></script>

</body>

</html>
